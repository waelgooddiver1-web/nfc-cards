<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>NFC Smart Business Card</title>

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Header */
    .header {
      position: relative;
      height: 120px;
      background: #1e1e1e;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -1px;
      right: 0;
      width: 100%;
      height: 45px;
      background: #fff;
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 13px;
    }

    .logo img {
      width: 42px;
    }

    .photo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #5b2d86;
      background: #fff;
      object-fit: cover;
    }

    .content {
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .title {
      color: #5b2d86;
      font-weight: 600;
      margin: 6px 0 14px;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .item i {
      color: #5b2d86;
      width: 18px;
    }

    .qr {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    canvas {
      border: 6px solid #5b2d86;
      border-radius: 14px;
      padding: 6px;
    }

    .error {
      text-align: center;
      padding: 40px;
      color: #900;
    }
  </style>
</head>

<body>
  <div class="card" id="card" style="display:none">
    <div class="header">
      <div class="logo">
        <img src="logo.png" alt="MBME" />
        <span>MBME GROUP</span>
      </div>
      <img id="photo" class="photo" />
    </div>

    <div class="content" id="profile"></div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

  <div id="error" class="error" style="display:none"></div>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <script>
    const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
    const SUPABASE_KEY = "PUT_YOUR_ANON_KEY_HERE";

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    if (!slug) {
      document.getElementById("error").innerText = "❌ لا يوجد slug في الرابط";
      document.getElementById("error").style.display = "block";
      throw "";
    }

    fetch(
      `${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}&is_active=eq.true`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    )
