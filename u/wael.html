<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Wael Mohamed – MBME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --purple: #5B2D86;
      --dark: #1E1E1E;
      --bg: #f2f2f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, var(--dark) 42%, #ffffff 42%);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .logo {
      width: 56px;
      height: auto;
      flex-shrink: 0;
    }

    .company {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    /* Content */
    .content {
      background: #fff;
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 4vw, 22px);
      color: #000;
    }

    .title {
      margin: 6px 0 18px;
      color: var(--purple);
      font-weight: 600;
      font-size: clamp(13px, 3.5vw, 15px);
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: #333;
      text-decoration: none;
      font-size: clamp(13px, 3.5vw, 14px);
      word-break: break-word;
    }

    .item i {
      color: var(--purple);
      font-size: 16px;
      width: 18px;
      flex-shrink: 0;
    }

    .ext {
      font-size: 12px;
      color: #777;
    }

    /* QR */
    .qr {
      margin-top: 22px;
      display: flex;
      justify-content: flex-start;
    }

    canvas {
      width: 100%;
      max-width: 160px;
      height: auto;
      border: 6px solid var(--purple);
      border-radius: 14px;
      padding: 6px;
    }

    /* Small screens */
    @media (max-width: 480px) {
      body {
        justify-content: center;
      }

      .qr {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Header -->
    <div class="header">
      <img src="logo.png" class="logo" alt="MBME Logo">
      <div class="company">MBME GROUP</div>
    </div>

    <!-- Content -->
    <div class="content">
      <div id="profile">
        <p>Loading...</p>
      </div>

      <div class="qr">
        <canvas id="qr"></canvas>
      </div>
    </div>

  </div>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- Supabase -->
  <script>
    const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_KEY";
    const PROFILE_SLUG = "wael";

    fetch(
      SUPABASE_URL +
      "/rest/v1/cards?select=*&profile_slug=eq." +
      PROFILE_SLUG +
      "&is_active=eq.true",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    )
    .then(res => res.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById("profile").innerHTML =
          "<p>Profile not found</p>";
        return;
      }

      const c = data[0];

      document.getElementById("profile").innerHTML = `
        <h1>${c.full_name}</h1>
        <div class="title">${c.job_title}</div>

        <a class="item" href="tel:${c.phone}">
          <i class="fa-solid fa-phone"></i>
          ${c.phone}
          ${c.ext ? `<span class="ext">(Ext ${c.ext})</span>` : ""}
        </a>

        <a class="item" href="https://wa.me/${c.whatsapp}">
          <i class="fa-brands fa-whatsapp"></i>
          WhatsApp
        </a>

        <a class="item" href="mailto:${c.email}">
          <i class="fa-solid fa-envelope"></i>
          ${c.email}
        </a>
      `;

      QRCode.toCanvas(
        document.getElementById("qr"),
        window.location.href,
        {
          width: 160,
          color: {
            dark: "#5B2D86",
            light: "#FFFFFF"
          }
        }
      );
    })
    .catch(() => {
      document.getElementById("profile").innerHTML =
        "<p>Connection error</p>";
    });
  </script>

</body>
</html>
