<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>MBME – Digital Card</title>

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body{
      margin:0;
      background:#f2f2f5;
      font-family:"Segoe UI",Tahoma,sans-serif;
      display:flex;
      justify-content:flex-start;
      padding:40px;
    }

    .card{
      width:100%;
      max-width:380px;
      background:linear-gradient(135deg,#1e1e1e 42%,#ffffff 42%);
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,.25);
      overflow:hidden;
    }

    .header{
      padding:24px;
      color:#fff;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:55px;
    }

    .company{
      font-size:14px;
      opacity:.9;
    }

    .content{
      background:#fff;
      padding:24px;
    }

    h1{
      margin:0;
      font-size:20px;
    }

    .title{
      color:#5B2D86;
      font-weight:600;
      margin-bottom:18px;
    }

    .item{
      display:flex;
      align-items:center;
      gap:10px;
      margin:10px 0;
      color:#333;
      text-decoration:none;
      font-size:14px;
    }

    .item i{
      color:#5B2D86;
      width:18px;
    }

    .qr{
      text-align:left;
      margin-top:20px;
    }

    canvas{
      border:6px solid #5B2D86;
      border-radius:12px;
      padding:6px;
      max-width:100%;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME">
    <div class="company">MBME GROUP</div>
  </div>

  <div class="content">
    <div id="profile">Loading...</div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

</div>

<script>
      const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy
      const PROFILE_SLUG = "wael";

fetch(`${SUPABASE_URL}/rest/v1/cards?select=*&profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {

  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "No data found";
    return;
  }

  const c = data[0];

  // HTML Card
  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <div class="item">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </div>

    <div class="item">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </div>

    <div class="item">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </div>
  `;

  // vCard from DB
  const vCard = `
BEGIN:VCARD
VERSION:3.0
N:${c.full_name.split(" ").reverse().join(";")};;;
FN:${c.full_name}
ORG:MBME GROUP
TITLE:${c.job_title}
TEL;TYPE=WORK,VOICE:${c.phone}
${c.ext ? `TEL;TYPE=WORK,VOICE:${c.phone};EXT=${c.ext}` : ""}
TEL;TYPE=CELL,WHATSAPP:${c.whatsapp}
EMAIL:${c.email}
END:VCARD
  `.trim();

  QRCode.toCanvas(
    document.getElementById("qr"),
    vCard,
    {
      width:150,
      color:{
        dark:"#5B2D86",
        light:"#FFFFFF"
      }
    }
  );
})
.catch(err=>{
  console.error(err);
  document.getElementById("profile").innerHTML="Connection error";
});
</script>

</body>
</html>
