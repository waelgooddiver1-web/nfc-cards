<div id="profile">
  <p>جاري التحميل...</p>
</div>
<script>
const SUPABASE_URL = "https://pltzgjgprvgajdxkzqd.supabase.co";
const SUPBASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
const PROFILE_SLUG = "wael";

fetch(
  `${SUPABASE_URL}/rest/v1/cards?select=*&profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true`,
  {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  }
)

.then(res => res.json())
.then(data => {
  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "<p>لم يتم العثور على البطاقة</p>";
    return;
  }

  const c = data[0];
  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <p>${c.job_title}</p>
    <a href="tel:${c.phone}">📞 اتصال</a>
    <a href="https://wa.me/${c.whatsapp}">💬 واتساب</a>
    <a href="mailto:${c.email}">✉️ بريد إلكتروني</a>
  `;
})
.catch(() => {
  document.getElementById("profile").innerHTML = "<p>خطأ في الاتصال</p>";
});
</script>
