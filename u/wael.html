<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MBME Digital Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
      overflow: hidden;
    }

    /* ================= HEADER ================= */
    .header {
      position: relative;
      height: 120px;
      overflow: hidden;
    }

    .header-bg {
      position: absolute;
      inset: 0;
      background: #1e1e1e;
    }

    .header-bg::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 160px;
      height: 60px;
      background: #fff;
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
    }

    .header-content {
      position: relative;
      z-index: 2;
      padding: 16px 20px;
      color: #fff;
    }

    .logo {
      width: 48px;
      margin-bottom: 6px;
    }

    .company {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: .9;
    }

    .photo {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #5b2d86;
      object-fit: cover;
      background: #fff;
      z-index: 3;
    }

    /* ================= CONTENT ================= */
    .content {
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      color: #000;
    }

    .title {
      margin: 6px 0 18px;
      color: #5b2d86;
      font-weight: 600;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: #333;
      font-size: 14px;
      text-decoration: none;
    }

    .item i {
      color: #5b2d86;
      width: 18px;
      text-align: center;
    }

    .qr {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    canvas {
      border: 6px solid #5b2d86;
      border-radius: 14px;
      padding: 6px;
      background: #fff;
    }

    @media (max-width: 420px) {
      .card {
        margin: 12px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="header-bg"></div>

    <div class="header-content">
      <img src="logo.png" class="logo" alt="MBME Logo">
      <div class="company">MBME GROUP</div>
    </div>

    <img id="photo" class="photo" />
  </div>

  <!-- CONTENT -->
  <div class="content" id="profile">
    <p>Loading...</p>
  </div>

  <div class="qr">
    <canvas id="qr"></canvas>
  </div>

</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY_HERE";
const PROFILE_SLUG = "wael";

fetch(`${SUPABASE_URL}/rest/v1/cards?profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true&select=*`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {
  if (!data.length) {
    document.getElementById("profile").innerHTML = "No data found";
    return;
  }

  const c = data[0];

  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <div class="item">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </div>

    <div class="item">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </div>

    <div class="item">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </div>
  `;

  if (c.photo_url) {
    document.getElementById("photo").src = c.photo_url;
  }

  /* vCard QR */
  const vcard = `
BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
TEL;TYPE=CELL:${c.whatsapp}
EMAIL:${c.email}
END:VCARD`;

  QRCode.toCanvas(document.getElementById("qr"), vcard, {
    width: 140,
    color: { dark: "#5b2d86", light: "#ffffff" }
  });
})
.catch(err => {
  console.error(err);
  document.getElementById("profile").innerHTML = "Connection error";
});
</script>

</body>
</html>
