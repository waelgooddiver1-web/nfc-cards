<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Digital Business Card – MBME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      margin: 0;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #1E1E1E 40%, #ffffff 40%);
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .header {
      position: relative;
      padding: 22px;
      color: #fff;
      min-height: 120px;
    }

    .logo {
      width: 60px;
    }

    .company {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    /* الصورة الشخصية */
    .profile-pic {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #5B2D86;
      background: #fff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.35);
    }

    .content {
      padding: 24px;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .title {
      color: #5B2D86;
      font-weight: 600;
      margin: 6px 0 18px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 14px;
      color: #333;
    }

    .item i {
      width: 22px;
      color: #5B2D86;
    }

    .qr {
      text-align: center;
      margin-top: 22px;
    }

    canvas {
      border: 6px solid #5B2D86;
      border-radius: 14px;
      padding: 6px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME Logo">
    <div class="company">MBME GROUP</div>

    <!-- الصورة الشخصية من Supabase -->
    <img id="profilePic" class="profile-pic" alt="Profile Photo">
  </div>

  <div class="content">
    <div id="profile">Loading...</div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "PUT_YOUR_ANON_KEY_HERE";
const PROFILE_SLUG = "wael";

fetch(
  `${SUPABASE_URL}/rest/v1/cards?select=*&profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true`,
  {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  }
)
.then(res => res.json())
.then(data => {
  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "No card found";
    return;
  }

  const c = data[0];

  // تعبئة الصورة الشخصية
  if (c.photo_url) {
    document.getElementById("profilePic").src = c.photo_url;
  }

  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <div class="item"><i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </div>

    <div class="item"><i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </div>

    <div class="item"><i class="fa-solid fa-envelope"></i>
      ${c.email}
    </div>
  `;

  const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
ORG:MBME GROUP
TITLE:${c.job_title}
TEL:${c.phone}
EMAIL:${c.email}
END:VCARD
  `.trim();

  QRCode.toCanvas(document.getElementById("qr"), vCard, {
    width: 140,
    color: { dark: "#5B2D86", light: "#FFFFFF" }
  });
})
.catch(() => {
  document.getElementById("profile").innerHTML = "Connection error";
});
</script>

</body>
</html>
