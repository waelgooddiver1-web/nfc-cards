<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>MBME Digital Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      margin: 0;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      overflow: hidden;
      position: relative;
    }

    .header {
      height: 140px;
      background: linear-gradient(135deg, #1e1e1e 70%, #ffffff 70%);
      padding: 20px;
      color: #fff;
      position: relative;
    }

    .logo {
      width: 55px;
    }

    .company {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 6px;
    }

  .photo {
  position: absolute;
  right: 20px;
  top: 18px;              /* 🔼 هذا هو السطر المهم */
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 4px solid #5b2d86;
  object-fit: cover;
  background: #fff;
}



    .content {
      padding: 70px 24px 24px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      color: #000;
    }

    .title {
      color: #5b2d86;
      font-weight: 600;
      margin: 6px 0 18px;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .item i {
      width: 26px;
      color: #5b2d86;
      font-size: 15px;
    }

    .qr {
      text-align: center;
      margin-top: 20px;
    }

    canvas {
      border: 6px solid #5b2d86;
      border-radius: 14px;
      padding: 6px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME Logo">
    <div class="company">MBME GROUP</div>
    <img id="profile-photo" class="photo" alt="Profile Photo">
  </div>

  <div class="content">
    <div id="profile">
      <p>Loading...</p>
    </div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

</div>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

// 🔹 استخرج profile_slug من الرابط
const slug = window.location.pathname.split("/").pop().replace(".html", "");

fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {
  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "<p>User not found</p>";
    return;
  }

  const c = data[0];

  // صورة شخصية
  document.getElementById("profile-photo").src = c.photo_url;

  // بيانات البطاقة
  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <a class="item" href="tel:${c.phone}">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </a>

    <a class="item" href="https://wa.me/${c.whatsapp}">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </a>

    <a class="item" href="mailto:${c.email}">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </a>
  `;

  // 🔹 vCard
  const vcard = `
BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
EMAIL:${c.email}
END:VCARD
  `.trim();

  QRCode.toCanvas(
    document.getElementById("qr"),
    vcard,
    {
      width: 150,
      color: {
        dark: "#5b2d86",
        light: "#ffffff"
      }
    }
  );
})
.catch(() => {
  document.getElementById("profile").innerHTML = "<p>Connection error</p>";
});
</script>

</body>
</html>
