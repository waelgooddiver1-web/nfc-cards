<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MBME Digital Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      position: relative;
      height: 150px;
      overflow: hidden;
    }

    .header-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1e1e1e 75%, transparent 75%);
      z-index: 1;
    }

    .header-content {
      position: relative;
      z-index: 2;
      padding: 20px;
      color: #fff;
    }

    .logo {
      width: 50px;
      display: block;
      margin-bottom: 6px;
    }

    .company {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: .9;
    }

    .photo {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid #5b2d86;
      object-fit: cover;
      background: #fff;
      z-index: 3;
    }

    /* ===== CONTENT ===== */
    .content {
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .title {
      color: #5b2d86;
      margin: 6px 0 18px;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: #333;
      font-size: 14px;
    }

    .item i {
      color: #5b2d86;
      width: 18px;
    }

    .qr {
      margin-top: 20px;
      text-align: center;
    }

    canvas {
      border: 6px solid #5b2d86;
      border-radius: 12px;
      padding: 6px;
      max-width: 100%;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="header-bg"></div>

    <div class="header-content">
      <img src="logo.png" class="logo" alt="MBME Logo">
      <div class="company">MBME GROUP</div>
    </div>

    <img id="photo" class="photo" />
  </div>

  <!-- CONTENT -->
  <div class="content" id="profile">
    <p>Loading...</p>
  </div>

  <div class="qr">
    <canvas id="qr"></canvas>
  </div>

</div>

<script>
/* ===== SUPABASE CONFIG ===== */
      const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy
      const PROFILE_SLUG = "wael";

/* ===== FETCH DATA ===== */
fetch(
  `${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${PROFILE_SLUG}`,
  {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  }
)
.then(res => res.json())
.then(data => {
  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "<p>No data found</p>";
    return;
  }

  const c = data[0];

  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <div class="item">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </div>

    <div class="item">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </div>

    <div class="item">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </div>
  `;

  if (c.photo_url) {
    document.getElementById("photo").src = c.photo_url;
  }

  QRCode.toCanvas(
    document.getElementById("qr"),
    c.card_url,
    {
      width: 150,
      color: {
        dark: "#5b2d86",
        light: "#ffffff"
      }
    }
  );
})
.catch(err => {
  console.error(err);
  document.getElementById("profile").innerHTML = "<p>Connection error</p>";
});
</script>

</body>
</html>
