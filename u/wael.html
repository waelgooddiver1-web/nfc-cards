<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MBME Digital Card</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body {
  margin: 0;
  background: #f2f2f5;
  font-family: "Segoe UI", Tahoma, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: min(92vw, 360px);
  background: linear-gradient(135deg, #1e1e1e 45%, #ffffff 45%);
  border-radius: 20px;
  box-shadow: 0 18px 40px rgba(0,0,0,.25);
  overflow: hidden;
  position: relative;
}

/* Header */
.header {
  padding: 22px;
  color: #fff;
  position: relative;
}

.logo {
  width: 55px;
}

.company {
  font-size: 13px;
  opacity: .85;
  margin-top: 6px;
}

/* Profile image */
.profile-pic {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #5B2D86;
  background: #fff;
  box-shadow: 0 6px 15px rgba(0,0,0,.35);
}

/* Content */
.content {
  background: #fff;
  padding: 24px;
}

h1 {
  margin: 0;
  font-size: 20px;
  color: #000;
}

.title {
  color: #5B2D86;
  font-weight: 600;
  margin: 6px 0 18px;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  color: #333;
  text-decoration: none;
  font-size: 14px;
}

.item i {
  color: #5B2D86;
  font-size: 16px;
}

/* QR */
.qr {
  display: flex;
  justify-content: center;
  margin-top: 22px;
}

canvas {
  border: 6px solid #5B2D86;
  border-radius: 14px;
  padding: 6px;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME Logo">
    <div class="company">MBME GROUP</div>

    <!-- profile image injected here -->
    <img id="profilePhoto" class="profile-pic" style="display:none;">
  </div>

  <div class="content">
    <div id="profile">Loading...</div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";
const PROFILE_SLUG = "wael";

fetch(
  `${SUPABASE_URL}/rest/v1/cards?select=*&profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true`,
  {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  }
)
.then(res => res.json())
.then(data => {
  if (!data.length) {
    document.getElementById("profile").innerHTML = "No profile found";
    return;
  }

  const c = data[0];

  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <a class="item" href="tel:${c.phone}">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </a>

    <a class="item" href="https://wa.me/${c.whatsapp}">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </a>

    <a class="item" href="mailto:${c.email}">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </a>
  `;

  if (c.photo_url) {
    const img = document.getElementById("profilePhoto");
    img.src = c.photo_url;
    img.style.display = "block";
  }

  const vcard = `
BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
EMAIL:${c.email}
END:VCARD`;

  QRCode.toCanvas(document.getElementById("qr"), vcard, {
    width: 140,
    color: { dark: "#5B2D86", light: "#FFFFFF" }
  });
})
.catch(() => {
  document.getElementById("profile").innerHTML = "Connection error";
});
</script>

</body>
</html>
