<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wael Mohamed – MBME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 24px;
    }

    /* Page container fills screen */
    .page {
      max-width: 420px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: linear-gradient(135deg, #1e1e1e 45%, #ffffff 45%);
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
      overflow: hidden;
      width: 100%;
    }

    /* Header */
    .header {
      position: relative;
      padding: 22px;
      color: #fff;
      min-height: 120px;
    }

    .logo {
      width: 54px;
      margin-bottom: 8px;
    }

    .company {
      font-size: 13px;
      opacity: .85;
      letter-spacing: 1px;
    }

    /* Profile photo */
    .avatar {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid #5B2D86;
      background: #fff;
      object-fit: cover;
    }

    /* Content */
    .content {
      background: #fff;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      color: #000;
    }

    .title {
      color: #5B2D86;
      font-weight: 600;
      margin: 6px 0 18px;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .item i {
      color: #5B2D86;
      font-size: 16px;
      width: 20px;
    }

    /* QR */
    .qr {
      margin-top: 24px;
      text-align: center;
    }

    canvas {
      border: 6px solid #5B2D86;
      border-radius: 14px;
      padding: 6px;
      max-width: 100%;
    }

    /* Responsive tweak */
    @media (max-width: 480px) {
      .avatar {
        width: 68px;
        height: 68px;
      }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <img src="logo.png" class="logo" alt="MBME Logo">
      <div class="company">MBME GROUP</div>

      <!-- Profile image from DB -->
      <img id="avatar" class="avatar" src="" alt="Profile Photo">
    </div>

    <!-- Content -->
    <div class="content">
      <div id="profile">Loading...</div>

      <div class="qr">
        <canvas id="qr"></canvas>
      </div>
    </div>

  </div>
</div>

<script>
      const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy
      const PROFILE_SLUG = "wael";

fetch(`${SUPABASE_URL}/rest/v1/cards?select=*&profile_slug=eq.${PROFILE_SLUG}&is_active=eq.true`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {
  if (!data || data.length === 0) {
    document.getElementById("profile").innerHTML = "No data found";
    return;
  }

  const c = data[0];

  // Fill profile
  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <a class="item" href="tel:${c.phone}">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} ${c.ext ? `(Ext ${c.ext})` : ""}
    </a>

    <a class="item" href="https://wa.me/${c.whatsapp.replace('+','')}">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </a>

    <a class="item" href="mailto:${c.email}">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </a>
  `;

  // Avatar
  if (c.photo_url) {
    document.getElementById("avatar").src = c.photo_url;
  }

  // vCard QR
  const vcard = `
BEGIN:VCARD
VERSION:3.0
N:${c.full_name}
FN:${c.full_name}
ORG:MBME Group
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
TEL;TYPE=CELL:${c.whatsapp}
EMAIL:${c.email}
END:VCARD`;

  QRCode.toCanvas(document.getElementById("qr"), vcard, {
    width: 160,
    color: {
      dark: "#5B2D86",
      light: "#FFFFFF"
    }
  });
})
.catch(() => {
  document.getElementById("profile").innerHTML = "Connection error";
});
</script>

</body>
</html>
