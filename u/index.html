<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> MBME Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 0 0 22px 22px;
      overflow: hidden;
      box-shadow: 0 18px 35px rgba(0,0,0,0.25);
    }

    .header {
      position: relative;
      background: linear-gradient(135deg, #1c1c1c 70%, transparent 70%);
      padding: 22px;
      height: 130px;
    }

    .logo { width: 54px; }
    .company {
      color: #ddd;
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .profile-pic {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid #6b2fa3;
      object-fit: cover;
      background: #fff;
    }

    .content { padding: 22px; }

    h1 { margin: 0; font-size: 20px; }

    .title {
      color: #6b2fa3;
      margin: 6px 0 18px;
      font-weight: 600;
    }

    .item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      font-size: 15px;
      color: #333;
      text-decoration: none;
    }

    .item i {
      width: 26px;
      color: #6b2fa3;
      margin-right: 10px;
    }

    .qr {
      display: flex;
      justify-content: center;
      padding: 22px 0 30px;
    }

    canvas {
      border: 6px solid #6b2fa3;
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME">
    <div class="company">MBME GROUP</div>
    <img id="photo" class="profile-pic" />
  </div>

  <div class="content" id="profile">
    <p>Loading...</p>
  </div>

  <div class="qr">
    <div id="qrcode"></div>
  </div>

</div>
