<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFC Card</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: #f2f2f2;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ===== Card Wrapper ===== */
.card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
.card-header {
  position: relative;
  background: #1c1c1c;
  padding: 20px;
  padding-bottom: 48px;
}

.logo { width: 52px; }

.company {
  color: #ffffff;
  font-size: 13px;
  margin-top: 6px;
  opacity: 0.9;
}

/* ===== Profile Photo ===== */
.avatar {
  position: absolute;
  right: 20px;
  top: 20px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 4px solid #6b2fa3;
  object-fit: cover;
  background: #fff;
}

/* ===== Content ===== */
.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.name {
  font-size: 20px;
  font-weight: 700;
  margin: 0;
}

.title {
  color: #6b2fa3;
  font-size: 14px;
  margin: 4px 0 14px;
}

.info a {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  font-size: 14px;
  color: #333;
  text-decoration: none;
}

.info a span {
  margin-left: 8px;
}

/* ===== QR ===== */
.qr-wrapper {
  margin-top: auto;
  display: flex;
  justify-content: center;
  padding: 20px 0 26px;
}

.qr {
  border: 4px solid #6b2fa3;
  border-radius: 16px;
  padding: 10px;
}
</style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="card-header">
    <img src="./logo.png" class="logo" alt="Logo">
    <div class="company">MBME GROUP</div>
    <img id="avatar" class="avatar">
  </div>

  <!-- BODY -->
  <div class="card-body">
    <h1 class="name" id="name"></h1>
    <div class="title" id="job"></div>

    <div class="info">
      <a id="phoneLink"><span>📞</span><span id="phone"></span></a>
      <a id="whatsappLink"><span>💬</span><span id="whatsapp"></span></a>
      <a id="emailLink"><span>✉️</span><span id="email"></span></a>
    </div>

    <div class="qr-wrapper">
      <div id="qr" class="qr"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

if (!slug) {
  document.body.innerHTML = "<h2>User not found</h2>";
  throw new Error("No slug");
}

const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY_HERE";

fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
  },
})
.then(res => res.json())
.then(data => {
  if (!data.length) return;
  const u = data[0];

  /* ===== Fill UI ===== */
  document.getElementById("name").textContent = u.full_name;
  document.getElementById("job").textContent = u.job_title;
  document.getElementById("phone").textContent = `${u.phone} (Ext ${u.ext})`;
  document.getElementById("whatsapp").textContent = u.whatsapp;
  document.getElementById("email").textContent = u.email;
  document.getElementById("avatar").src = u.photo_url;

  /* ===== Interactive links ===== */
  document.getElementById("phoneLink").href = `tel:${u.phone}`;
  document.getElementById("whatsappLink").href = `https://wa.me/${u.whatsapp.replace('+','')}`;
  document.getElementById("emailLink").href = `mailto:${u.email}`;

  /* ===== vCard for QR ===== */
  const vCard = `
BEGIN:VCARD
VERSION:3.0
N:${u.full_name}
FN:${u.full_name}
ORG:MBME GROUP
TITLE:${u.job_title}
TEL;TYPE=WORK:${u.phone}
TEL;TYPE=WORK;EXT=${u.ext}:${u.ext}
TEL;TYPE=CELL:${u.whatsapp}
EMAIL:${u.email}
PHOTO;VALUE=URI:${u.photo_url}
END:VCARD
`.trim();

  new QRCode(document.getElementById("qr"), {
    text: vCard,
    width: 180,
    height: 180,
    colorDark: "#6b2fa3",
    colorLight: "#ffffff",
  });
});
</script>

</body>
</html>
