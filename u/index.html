<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NFC Smart Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      box-sizing: border-box;
    }

    /* ✅ الصفحة تبدأ من الأعلى */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;   /* توسيط أفقي فقط */
      align-items: flex-start;   /* ⬅️ من أعلى */
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding-top: 12px;         /* مسافة خفيفة من الأعلى */
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      position: relative;
      height: 120px;
      background: linear-gradient(135deg, #1b1b1b 75%, #ffffff 75%);
      padding: 20px;
      color: #fff;
    }

    .logo {
      width: 48px;
    }

    .company {
      font-size: 13px;
      margin-top: 8px;
      opacity: .85;
    }

    .avatar {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #6b2fa0;
      background: #fff;
      object-fit: cover;
    }

    /* ===== CONTENT ===== */
    .content {
      padding: 24px 22px 28px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #000;
    }

    .title {
      margin-top: 6px;
      font-size: 14px;
      color: #6b2fa0;
      font-weight: 600;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 14px;
      color: #222;
      text-decoration: none;
    }

    .item i {
      color: #6b2fa0;
      font-size: 16px;
      width: 20px;
    }

    /* ===== QR ===== */
    .qr {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    canvas {
      border: 6px solid #6b2fa0;
      border-radius: 14px;
      padding: 6px;
    }

    @media (max-width: 480px) {
      .card {
        margin: 0 10px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <img src="logo.png" class="logo" alt="MBME Logo" />
    <div class="company">MBME GROUP</div>
    <img id="avatar" class="avatar" src="" alt="Profile Photo" />
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div id="profile">Loading...</div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>
  </div>

</div>

<!-- QR library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

const params = new URLSearchParams(window.location.search);
const PROFILE_SLUG = params.get("slug") || "wael";

fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${PROFILE_SLUG}`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {
  if (!data.length) {
    document.getElementById("profile").innerHTML = "Profile not found";
    return;
  }

  const c = data[0];
  document.getElementById("avatar").src = c.photo_url;

  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <a class="item" href="tel:${c.phone}">
      <i class="fa-solid fa-phone"></i>
      ${c.phone} (Ext ${c.ext})
    </a>

    <a class="item" href="https://wa.me/${c.whatsapp}" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </a>

    <a class="item" href="mailto:${c.email}">
      <i class="fa-solid fa-envelope"></i>
      ${c.email}
    </a>
  `;

  QRCode.toCanvas(
    document.getElementById("qr"),
    c.card_url,
    { width: 140, color: { dark: "#6b2fa0", light: "#ffffff" } }
  );
});
</script>

</body>
</html>
