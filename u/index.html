<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFC Business Card</title>

<!-- Icons -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #f2f2f5;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ================= CARD ================= */
.card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.18);
  overflow: hidden;

  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */
.card-header {
  position: relative;
  background: #1c1c1c;
  padding: 22px;
  padding-bottom: 48px;
}

.logo {
  width: 52px;
}

.company {
  color: #fff;
  font-size: 13px;
  margin-top: 6px;
  opacity: 0.9;
}

/* Profile photo */
.avatar {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 4px solid #6b2fa3;
  object-fit: cover;
  background: #fff;
}

/* ================= BODY ================= */
.card-body {
  padding: 22px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.name {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}

.title {
  color: #6b2fa3;
  margin: 6px 0 18px;
  font-weight: 600;
  font-size: 14px;
}

.item {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  font-size: 15px;
  color: #333;
  text-decoration: none;
}

.item i {
  width: 26px;
  color: #6b2fa3;
  font-size: 16px;
  margin-right: 10px;
}

/* ================= QR ================= */
.qr-wrapper {
  margin-top: auto;          /* 🔑 يثبّت QR بالأسفل */
  display: flex;
  justify-content: center;
  padding: 24px 0 28px;
}

canvas {
  border: 6px solid #6b2fa3;
  border-radius: 16px;
}

/* ================= MOBILE NFC ================= */
@media (max-width: 480px) {
  body {
    background: #fff;
  }

  .card {
    height: 882px;            /* ✅ طول NFC */
    border-radius: 0;
  }
}

/* ================= TABLET ================= */
@media (min-width: 768px) {
  .card {
    min-height: 90vh;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="card-header">
    <img src="./logo.png" class="logo" alt="MBME">
    <div class="company">MBME GROUP</div>
    <img id="avatar" class="avatar" />
  </div>

  <!-- BODY -->
  <div class="card-body" id="profile">
    <p>Loading...</p>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

/* ================= GET SLUG ================= */
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

if (!slug) {
  document.body.innerHTML = "<h2>User not found</h2>";
  throw new Error("No slug");
}

/* ================= FETCH DATA ================= */
fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
  },
})
.then(res => res.json())
.then(data => {
  if (!data.length) return;

  const u = data[0];

  /* Fill UI */
  document.getElementById("avatar").src = u.photo_url;

  document.getElementById("profile").innerHTML = `
    <h1 class="name">${u.full_name}</h1>
    <div class="title">${u.job_title}</div>

    <a class="item" href="tel:${u.phone}">
      <i class="fa-solid fa-phone"></i>
      ${u.phone} (Ext ${u.ext})
    </a>

    <a class="item" href="https://wa.me/${u.whatsapp.replace('+','')}">
      <i class="fa-brands fa-whatsapp"></i>
      ${u.whatsapp}
    </a>

    <a class="item" href="mailto:${u.email}">
      <i class="fa-solid fa-envelope"></i>
      ${u.email}
    </a>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>
  `;

  /* ================= VCARD ================= */
  const vCard = `
BEGIN:VCARD
VERSION:3.0
N:${u.full_name}
FN:${u.full_name}
ORG:MBME GROUP
TITLE:${u.job_title}
TEL;TYPE=WORK:${u.phone}
TEL;TYPE=WORK;EXT=${u.ext}:${u.ext}
TEL;TYPE=CELL:${u.whatsapp}
EMAIL:${u.email}
PHOTO;VALUE=URI:${u.photo_url}
END:VCARD
`.trim();

  /* ================= QR ================= */
  QRCode.toCanvas(
    document.createElement("canvas"),
    vCard,
    { width: 220 },
    (err, canvas) => {
      if (!err) document.getElementById("qrcode").appendChild(canvas);
    }
  );
});
</script>

</body>
</html>
