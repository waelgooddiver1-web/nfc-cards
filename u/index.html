<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NFC Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 0 0 22px 22px;
      overflow: hidden;
      box-shadow: 0 18px 35px rgba(0,0,0,0.25);
    }

    /* HEADER */
    .header {
      position: relative;
      background: linear-gradient(135deg, #1c1c1c 70%, transparent 70%);
      padding: 22px;
      height: 140px;
    }

    .logo {
      width: 54px;
      margin-bottom: 6px;
    }

    .company {
      color: #ddd;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .profile-pic {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #6b2fa3;
      object-fit: cover;
      background: #fff;
    }

    /* CONTENT */
    .content {
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .title {
      color: #6b2fa3;
      margin: 6px 0 18px;
      font-weight: 600;
    }

    .item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      font-size: 15px;
      color: #333;
      text-decoration: none;
    }

    .item i {
      width: 26px;
      color: #6b2fa3;
      font-size: 16px;
      margin-right: 10px;
    }

    /* QR */
    .qr {
      display: flex;
      justify-content: center;
      padding: 22px 0 30px;
    }

    canvas {
      border: 6px solid #6b2fa3;
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <img src="logo.png" class="logo" alt="MBME">
    <div class="company">MBME GROUP</div>

    <img id="photo" class="profile-pic" alt="Profile Photo">
  </div>

  <!-- CONTENT -->
  <div class="content" id="profile">
    <p>Loading...</p>
  </div>

  <!-- QR -->
  <div class="qr">
    <div id="qrcode"></div>
  </div>

</div>

<script>
/* ==========================
   SUPABASE CONFIG
========================== */
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY_HERE";

/* ==========================
   GET SLUG
========================== */
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug") || "wael";

/* ==========================
   FETCH DATA
========================== */
fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}&is_active=eq.true`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(rows => {
  if (!rows.length) {
    document.getElementById("profile").innerHTML = "<p>No data found</p>";
    return;
  }

  const d = rows[0];

  /* Image */
  document.getElementById("photo").src = d.photo_url;

  /* Profile */
  document.getElementById("profile").innerHTML = `
    <h1>${d.full_name}</h1>
    <div class="title">${d.job_title}</div>

    <a class="item" href="tel:${d.phone}">
      <i class="fa-solid fa-phone"></i>
      ${d.phone} (Ext ${d.ext})
    </a>

    <a class="item" href="https://wa.me/${d.whatsapp.replace('+','')}">
      <i class="fa-brands fa-whatsapp"></i>
      ${d.whatsapp}
    </a>

    <a class="item" href="mailto:${d.email}">
      <i class="fa-solid fa-envelope"></i>
      ${d.email}
    </a>
  `;

  /* vCard */
  const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:${d.full_name}
ORG:MBME GROUP
TITLE:${d.job_title}
TEL;TYPE=WORK:${d.phone}
TEL;TYPE=CELL:${d.whatsapp}
EMAIL:${d.email}
PHOTO;VALUE=URI:${d.photo_url}
END:VCARD
`.trim();

  QRCode.toCanvas(
    document.createElement("canvas"),
    vCard,
    { width: 220 },
    (err, canvas) => {
      if (!err) document.getElementById("qrcode").appendChild(canvas);
    }
  );
})
.catch(err => {
  console.error(err);
  document.getElementById("profile").innerHTML = "<p>Error loading data</p>";
});
</script>

</body>
</html>
