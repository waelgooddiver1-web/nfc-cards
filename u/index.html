<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Card</title>

<!-- Icons -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #f2f2f5;
  font-family: "Segoe UI", Tahoma, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.25);
  overflow: hidden;
}

.header {
  position: relative;
  height: 140px;
  background: #1e1e1e;
  clip-path: polygon(0 0,100% 0,100% 75%,85% 100%,0 100%);
  padding: 20px;
  color: #fff;
}

.header img.logo {
  width: 50px;
}

.header .company {
  margin-top: 8px;
  font-size: 13px;
  opacity: .85;
}

.avatar {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 86px;
  height: 86px;
  border-radius: 50%;
  border: 4px solid #6b2da0;
  background: #fff;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.content {
  padding: 20px;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.job {
  color: #6b2da0;
  font-weight: 600;
  margin: 6px 0 18px;
}

.item {
  display: flex;
  align-items: center;
  margin: 10px 0;
  font-size: 14px;
  color: #333;
}

.item i {
  width: 26px;
  color: #6b2da0;
}

.qr {
  text-align: center;
  margin-top: 18px;
}

canvas {
  border: 6px solid #6b2da0;
  border-radius: 14px;
  padding: 6px;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <img src="logo.png" class="logo" alt="MBME">
    <div class="company">MBME GROUP</div>

    <div class="avatar">
      <img id="photo" src="" alt="Profile">
    </div>
  </div>

  <div class="content" id="profile">
    <p>Loading...</p>
  </div>

  <div class="qr">
    <canvas id="qr"></canvas>
  </div>

</div>

<script>
      const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

// 🔹 get slug
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

if (!slug) {
  document.getElementById("profile").innerHTML = "<p>No profile specified</p>";
  throw new Error("Missing slug");
}

fetch(
  `${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}`,
  {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  }
)
.then(r => r.json())
.then(d => {
  if (!d.length) {
    document.getElementById("profile").innerHTML = "<p>Profile not found</p>";
    return;
  }

  const c = d[0];

  // profile data
  document.getElementById("profile").innerHTML = `
    <h1>${c.full_name}</h1>
    <div class="job">${c.job_title}</div>

    <div class="item"><i class="fa-solid fa-phone"></i>
      ${c.phone} (Ext ${c.ext})
    </div>

    <div class="item"><i class="fa-brands fa-whatsapp"></i>
      ${c.whatsapp}
    </div>

    <div class="item"><i class="fa-solid fa-envelope"></i>
      ${c.email}
    </div>
  `;

  // profile photo
  document.getElementById("photo").src = c.photo_url;

  // vCard
  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
ORG:MBME GROUP
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
TEL;TYPE=CELL:${c.whatsapp}
EMAIL:${c.email}
END:VCARD`;

  QRCode.toCanvas(
    document.getElementById("qr"),
    vcard,
    { width: 150, color: { dark: "#6b2da0", light: "#ffffff" } }
  );
})
.catch(() => {
  document.getElementById("profile").innerHTML = "<p>Connection error</p>";
});
</script>

</body>
</html>
