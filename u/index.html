<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFC Card</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f2f2f2;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ===== Card Wrapper ===== */
.card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;

  /* IMPORTANT */
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
.card-header {
  position: relative;
  background: #1c1c1c;
  padding: 20px;
  padding-bottom: 48px;
}

.logo {
  width: 52px;
}

.company {
  color: #ffffff;
  font-size: 13px;
  margin-top: 6px;
  opacity: 0.9;
}

/* Diagonal cut 
.card-header::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 80%;
  height: 42px;
  background: #ffffff;
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
}*/

/* ===== Profile Photo ===== */
.avatar {
  position: absolute;
  right: 20px;
  top: 20px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 4px solid #6b2fa3;
  object-fit: cover;
  background: #fff;
}

/* ===== Content ===== */
.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.name {
  font-size: 20px;
  font-weight: 700;
  margin: 0;
}

.title {
  color: #6b2fa3;
  font-size: 14px;
  margin: 4px 0 14px;
}

.info {
  font-size: 14px;
  color: #333;
}

.info div {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.info span {
  margin-left: 8px;
}

/* ===== QR Section ===== */
.qr-wrapper {
  margin-top: auto; /* KEY FIX */
  display: flex;
  justify-content: center;
  padding-top: 20px;
}

.qr {
  border: 4px solid #6b2fa3;
  border-radius: 16px;
  padding: 10px;
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .card {
    border-radius: 20px;
  }
}
</style>
</head>

<body>

<div class="card">
  <!-- HEADER -->
  <div class="card-header">
    <img src="./logo.png" class="logo" alt="Logo">
    <div class="company">MBME GROUP</div>
    <img id="avatar" class="avatar" />
  </div>

  <!-- BODY -->
  <div class="card-body">
    <h1 class="name" id="name"></h1>
    <div class="title" id="job"></div>

    <div class="info">
      <div>📞 <span id="phone"></span></div>
      <div>💬 <span id="whatsapp"></span></div>
      <div>✉️ <span id="email"></span></div>
    </div>

    <!-- QR AT BOTTOM -->
    <div class="qr-wrapper">
      <div id="qr" class="qr"></div>
    </div>
  </div>
</div>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

if (!slug) {
  document.body.innerHTML = "<h2>User not found</h2>";
  throw new Error("No slug");
}

const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

fetch(`${SUPABASE_URL}/rest/v1/cards_with_url?profile_slug=eq.${slug}`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
  },
})
.then(res => res.json())
.then(data => {
  if (!data.length) return;

  const u = data[0];

  document.getElementById("name").textContent = u.full_name;
  document.getElementById("job").textContent = u.job_title;
  document.getElementById("phone").textContent = `${u.phone} (Ext ${u.ext})`;
  document.getElementById("whatsapp").textContent = u.whatsapp;
  document.getElementById("email").textContent = u.email;
  document.getElementById("avatar").src = u.photo_url;

  new QRCode(document.getElementById("qr"), {
    text: u.card_url,
    width: 180,
    height: 180,
    colorDark: "#6b2fa3",
    colorLight: "#ffffff",
  });
});
</script>

</body>
</html>
