<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NFC Business Card</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  margin:0;
  background:#f2f2f5;
  font-family:"Segoe UI",Tahoma,sans-serif;
}

/* Page wrapper */
.page{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:12px;
}

/* Card */
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  overflow:hidden;
}

/* Header */
.header{
  position:relative;
  height:120px;
  background:#1e1e1e;
}

.header::after{
  content:"";
  position:absolute;
  bottom:-1px;
  right:0;
  width:100%;
  height:45px;
  background:#fff;
  clip-path:polygon(0 100%,100% 0,100% 100%);
}

/* Logo */
.logo{
  position:absolute;
  top:18px;
  left:18px;
  color:#fff;
  font-size:13px;
}
.logo img{width:42px;display:block;margin-bottom:6px}

/* Photo */
.photo{
  position:absolute;
  top:18px;
  right:18px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid #5b2d86;
  object-fit:cover;
  background:#fff;
}

/* Content */
.content{
  padding:20px;
}

h1{
  margin:0;
  font-size:20px;
}

.title{
  color:#5b2d86;
  font-weight:600;
  margin:6px 0 14px;
  font-size:14px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
  font-size:14px;
  color:#333;
}

.item i{
  color:#5b2d86;
  width:18px;
}

/* QR */
.qr{
  display:flex;
  justify-content:center;
  padding:18px 0 22px;
}

canvas{
  max-width:160px;
  width:100%!important;
  height:auto!important;
  border:6px solid #5b2d86;
  border-radius:14px;
  padding:6px;
}

/* Mobile */
@media(max-width:480px){
  .card{border-radius:14px}
  h1{font-size:18px}
}
</style>
</head>

<body>
<div class="page">
  <div class="card">

    <div class="header">
      <div class="logo">
        <img src="logo.png" alt="MBME">
        MBME GROUP
      </div>
      <img id="photo" class="photo" src="" alt="Profile">
    </div>

    <div class="content" id="profile">
      <p>Loading...</p>
    </div>

    <div class="qr">
      <canvas id="qr"></canvas>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://pdtzqjgjprvgajdxkzqd.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHpxamdqcHJ2Z2FqZHhrenFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MTY4NzcsImV4cCI6MjA4MjQ5Mjg3N30.3azWCfjT3IqyO4QQGCRpwIBsoOHCq7TqvebUEBOoVsY"; // anon legacy

/* slug from URL */
const params = new URLSearchParams(window.location.search);
const SLUG = params.get("slug") || "wael";

/* Fetch card */
fetch(`${SUPABASE_URL}/rest/v1/cards?profile_slug=eq.${SLUG}&is_active=eq.true&select=*`,{
  headers:{
    apikey:SUPABASE_KEY,
    Authorization:`Bearer ${SUPABASE_KEY}`
  }
})
.then(r=>r.json())
.then(data=>{
  if(!data.length){
    document.getElementById("profile").innerHTML="<p>User not found</p>";
    return;
  }

  const c=data[0];

  /* Profile data */
  document.getElementById("profile").innerHTML=`
    <h1>${c.full_name}</h1>
    <div class="title">${c.job_title}</div>

    <div class="item"><i class="fa-solid fa-phone"></i>${c.phone} (Ext ${c.ext})</div>
    <div class="item"><i class="fa-brands fa-whatsapp"></i>${c.whatsapp}</div>
    <div class="item"><i class="fa-solid fa-envelope"></i>${c.email}</div>
  `;

  /* Photo */
  if(c.photo_url){
    document.getElementById("photo").src=c.photo_url;
  }

  /* vCard */
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${c.full_name}
ORG:MBME GROUP
TITLE:${c.job_title}
TEL;TYPE=WORK:${c.phone}
TEL;TYPE=CELL:${c.whatsapp}
EMAIL:${c.email}
END:VCARD`;

  QRCode.toCanvas(document.getElementById("qr"),vcard,{
    color:{dark:"#5b2d86",light:"#ffffff"}
  });
})
.catch(()=>{
  document.getElementById("profile").innerHTML="<p>Connection error</p>";
});
</script>

</body>
</html>
